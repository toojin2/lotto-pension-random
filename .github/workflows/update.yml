name: 당첨번호 갱신

on:
  schedule:
    # GitHub cron은 UTC 기준 (KST - 9시간)
    - cron: "30 10,12,14 * * 4"   # 목 19:30 / 21:30 / 23:30 KST (연금720+)
    - cron: "0 12,14 * * 6"       # 토 21:00 / 23:00 KST (로또)
    - cron: "0 1 * * 0"           # 일 10:00 KST (놓친 것 보충)
  workflow_dispatch:              # Actions 탭에서 수동 실행

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 연금720+ 갱신
        run: python python/fetch_draws.py
      - name: 로또 갱신
        if: always()              # 연금이 실패해도 로또는 시도
        run: python python/fetch_lotto.py
      - name: 변경 시 커밋
        if: always()              # 한쪽만 성공해도 반영
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add js/data.js js/data_lotto.js
          git diff --cached --quiet || (git commit -m "당첨번호 자동 갱신" && git push)
